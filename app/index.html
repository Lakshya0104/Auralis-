<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURALIS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<style>
  :root { --bg: #111; --fg: #f5f5f5; --muted: #9a9a9a; --accent: #ffd400; --danger: #ff4d4d; --ok: #3ddc84; --card: #1d1d1d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.4 system-ui, sans-serif; padding: 12px 16px 40px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: 2px; color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button, select { font: inherit; font-weight: 600; min-height: 64px; border-radius: 14px; border: 2px solid #333;
                   background: var(--card); color: var(--fg); padding: 8px; }
  button:active { background: #333; }
  button.primary { background: var(--accent); color: #111; border-color: var(--accent); }
  .full { grid-column: 1 / -1; }
  #status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; font-size: 14px; }
  #status div { background: var(--card); border-radius: 10px; padding: 8px; text-align: center; }
  #status b { display: block; font-size: 20px; }
  #level { font-size: 28px; font-weight: 800; text-align: center; padding: 14px; border-radius: 14px; margin: 10px 0; background: var(--card); }
  .l0 { color: var(--ok); } .l1 { color: var(--accent); } .l2 { color: orange; } .l3 { background: var(--danger) !important; color: #fff; }
  #view { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #000; margin: 10px 0; }
  #view video, #view canvas { width: 100%; display: block; }
  #view canvas { position: absolute; inset: 0; }
  details { background: var(--card); border-radius: 14px; padding: 10px 12px; margin-top: 10px; }
  summary { font-weight: 700; cursor: pointer; }
  #log { font: 13px/1.3 ui-monospace, monospace; color: var(--muted); max-height: 160px; overflow: auto; white-space: pre-wrap; }
  #places button { width: 100%; margin-top: 6px; }
</style>
</head>
<body>
  <h1>AURALIS</h1>
  <div class="sub">Smart cane · remembers hazards and places · multilingual voice</div>

  <div class="grid">
    <select id="lang" class="full" aria-label="Language"></select>
    <button id="btnCane" class="primary">Connect cane</button>
    <button id="btnStart" class="primary">Start walking</button>
    <button id="btnSave">Save this place</button>
    <button id="btnWhere">Where am I?</button>
    <button id="btnGone">Hazard gone here</button>
    <button id="btnStop">Stop guidance</button>
  </div>

  <div id="level" class="l0" aria-live="assertive">—</div>
  <div id="status">
    <div>Front<b id="sFront">–</b></div>
    <div>Ground<b id="sDown">–</b></div>
    <div>GPS<b id="sGps">–</b></div>
    <div>Hazards<b id="sHaz">0</b></div>
    <div>Places<b id="sPlaces">0</b></div>
    <div>Map nodes<b id="sNodes">0</b></div>
  </div>

  <details open><summary>Go to a saved place</summary><div id="places"></div></details>

  <div id="view"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>

  <details><summary>Research mode (label data for the neural network)</summary>
    <p class="sub">While walking, tap what the situation really is. Rows are saved with the 8 sensor features.</p>
    <div class="grid">
      <button data-label="0">Safe</button><button data-label="1">Caution</button>
      <button data-label="2">Warning</button><button data-label="3">Urgent</button>
      <button id="btnExport">Export training CSV</button><button id="btnExportMem">Export memory JSON</button>
      <button id="btnRoutes" class="full">Compare shortest vs safest route (to first place)</button>
    </div>
  </details>
  <details><summary>Event log</summary><div id="log"></div></details>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
